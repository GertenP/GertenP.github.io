<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerten Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerten Clicker</h1>
        <div class="score-display">
            Skoor: <span id="score">0</span>
        </div>
        <img src="gerten.png" id="gerten" alt="Gerten">
        <div class="shop">
            <h2>Pood</h2>
            <button id="upgrade-click">Tugevda klikki (100 punkti)</button>
            <button id="auto-clicker">Automaatklõpsaja (500 punkti)</button>
            <button id="multiplier">Kordaja (1000 punkti)</button>
            <div class="upgrades">
                <p id="clickPower">Klikijõud: <span>1</span></p>
                <p id="autoClickerRate">Automaatklõpsu sagedus: <span>0</span> sekundit</p>
                <p id="multiplierLevel">Kordaja tase: <span>1x</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
